[package]
repository = "https://github.com/SuperInstance/character-sheet"
name = "character-sheet"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "RPG character sheet format — the .nail bundle reimagined as a proper character save file"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
